name: Build and smoke-test CLI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out wrapper
        uses: actions/checkout@v7
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Set up Python for JSON validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Check out MetFrag source
        uses: actions/checkout@v7
        with:
          repository: ipb-halle/MetFragRelaunched
          ref: 2c8671b4d8d29b05ca9461e1238c2e4268ce9e21
          path: MetFragRelaunched
      - name: Install MetFragLib locally
        run: mvn -B clean install -pl MetFragLib -am -DskipTests
        working-directory: MetFragRelaunched
      - name: Package wrapper
        run: mvn -B clean package
        working-directory: metfrag-tools
      - name: Generate runtime dependency SBOM
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
        working-directory: metfrag-tools
      - name: Print runtime component license metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          with open("metfrag-tools/target/bom.json", encoding="utf-8") as source:
              bom = json.load(source)
          for component in bom.get("components", []):
              licenses = component.get("licenses", [])
              rendered = ", ".join((item.get("license", {}).get("id") or item.get("license", {}).get("name") or item.get("expression") or "unspecified") for item in licenses) or "unspecified"
              print(f'{component.get("group", "")}:{component.get("name")}:{component.get("version")} | {rendered}')
          PY
      - name: Run representative SMILES and validate JSON
        shell: bash
        run: |
          jar="metfrag-tools/target/streamfind-metfrag-fragmenter-0.1.0-SNAPSHOT.jar"
          while IFS='|' read -r smiles depth; do
            java -jar "$jar" --smiles "$smiles" --depth "$depth" |
              python -c 'import json,sys; d=json.load(sys.stdin); assert d["schema_version"] == 1; assert d["fragments"]; assert all(isinstance(f["smiles"], str) and f["smiles"] and isinstance(f["formula"], str) and f["formula"] and isinstance(f["atom_indices"], list) and isinstance(f["broken_bond_indices"], list) and isinstance(f["neutral_losses"], list) for f in d["fragments"]); ids={f["id"] for f in d["fragments"]}; assert sum(f["parent_id"] is None for f in d["fragments"]) == 1; assert all(f["parent_id"] in ids for f in d["fragments"] if f["parent_id"] is not None); assert all(f["depth"] <= d["requested_depth"] and f["exact_mass"] > 0 for f in d["fragments"]); assert d["relationship_status"] == "captured_during_depth_traversal"; assert d["neutral_loss_status"] == "metfrag_pattern_and_atom_mask_matches"; assert d["input_smiles"] != "CCO" or any(f["neutral_losses"] for f in d["fragments"]); print("validated", len(d["fragments"]), "fragments for", d["input_smiles"]); [print("ETHANOL_NEUTRAL_LOSS", json.dumps(f)) for f in d["fragments"] if f["neutral_losses"]]'
          done <<'MOLECULES'
          CCO|1
          CC(=O)Oc1ccccc1C(=O)O|2
          COc1cc(C=O)ccc1O|2
          CC(C)NCC(COC1=CC=C(C=C1)CCOC)O|1
          MOLECULES
      - name: Verify optional integration libraries are not shaded
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          jar = "metfrag-tools/target/streamfind-metfrag-fragmenter-0.1.0-SNAPSHOT.jar"
          with zipfile.ZipFile(jar) as archive:
              names = archive.namelist()
          forbidden = ("com/mysql/", "org/postgresql/", "jxl/", "net/rforge/", "org/openjdk/nashorn/", "org/junit/", "junit/", "org/hamcrest/")
          found = [name for name in names if name.startswith(forbidden)]
          assert not found, found
          print("Optional database, spreadsheet, R, script, and test adapters are excluded")
          PY
      - name: Print metoprolol JSON example
        shell: bash
        run: |
          java -jar metfrag-tools/target/streamfind-metfrag-fragmenter-0.1.0-SNAPSHOT.jar --smiles 'CC(C)NCC(COC1=CC=C(C=C1)CCOC)O' --depth 1 |
            python -c 'import json,sys; d=json.load(sys.stdin); frags=d["fragments"]; assert frags and frags[0]["formula"] == "C15H25NO3"; d["fragment_count_total"]=len(frags); d["preview_truncated"]=len(frags)>5; d["fragments"]=frags[:5]; print("METOPROLOL_JSON_BEGIN"); print(json.dumps(d,indent=2)); print("METOPROLOL_JSON_END")'

      - name: Upload runtime dependency SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: runtime-sbom-${{ matrix.os }}
          path: metfrag-tools/target/bom.json
          if-no-files-found: error
          retention-days: 14
